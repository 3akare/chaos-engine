<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chaos Engine sandbox</title>
    <style>
      html, body { margin: 0; height: 100%; background: #23252f; font-family: system-ui, sans-serif; color: #eee; }
      #wrap { display: flex; flex-direction: column; height: 100%; max-width: 480px; margin: 0 auto; }
      #bar { display: flex; gap: 6px; padding: 8px; flex-wrap: wrap; align-items: center; }
      #bar select, #bar button { font: 14px system-ui; padding: 8px 10px; border-radius: 8px; border: 0; }
      #bar button { background: #2f6fdb; color: #fff; font-weight: 600; }
      #board { flex: 1; min-height: 0; }
      #status { padding: 6px 10px; font-size: 13px; min-height: 18px; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="bar">
        <select id="fixture"></select>
        <select id="variant"></select>
        <button id="run">▶ Run</button>
        <button id="speed">1×</button>
        <button id="solution">Solution</button>
        <button id="clear">Clear</button>
      </div>
      <div id="status">Tap a socket to cycle pieces.</div>
      <div id="board"></div>
    </div>
    <script type="module" src="./sandbox.ts"></script>
  </body>
</html>
